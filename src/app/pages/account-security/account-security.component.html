<div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Security</h1>
      <p class="page-subtitle">Update the password for your current account.</p>
    </div>
  </div>

  <mat-card class="security-card">
    <mat-card-header>
      <mat-card-title>Change password</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="changePassword()" class="password-form">
        <mat-form-field appearance="outline">
          <mat-label>Current password</mat-label>
          <input matInput [type]="hideCurrentPassword ? 'password' : 'text'" formControlName="currentPassword" autocomplete="current-password">
          <button mat-icon-button matSuffix type="button" aria-label="Toggle current password" (click)="hideCurrentPassword = !hideCurrentPassword">
            <mat-icon>{{ hideCurrentPassword ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>New password</mat-label>
          <input matInput [type]="hideNewPassword ? 'password' : 'text'" formControlName="newPassword" autocomplete="new-password">
          <button mat-icon-button matSuffix type="button" aria-label="Toggle new password" (click)="hideNewPassword = !hideNewPassword">
            <mat-icon>{{ hideNewPassword ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
          <mat-error>Use at least 8 characters.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Confirm new password</mat-label>
          <input matInput [type]="hideConfirmPassword ? 'password' : 'text'" formControlName="confirmPassword" autocomplete="new-password">
          <button mat-icon-button matSuffix type="button" aria-label="Toggle confirmation password" (click)="hideConfirmPassword = !hideConfirmPassword">
            <mat-icon>{{ hideConfirmPassword ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
        </mat-form-field>
        @if (form.hasError('passwordMismatch') && form.controls.confirmPassword.touched) {
          <p class="field-error">Passwords do not match.</p>
        }

        <div class="actions">
          <button mat-flat-button color="primary" type="submit">
            <mat-icon>lock_reset</mat-icon>
            Update password
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
