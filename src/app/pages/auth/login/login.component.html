<section class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>NextFlowTech</mat-card-title>
      <mat-card-subtitle>Sign in to manage invoices, customers, and expenses.</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" autocomplete="current-password">
          <button mat-icon-button matSuffix type="button" aria-label="Toggle password" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
        </mat-form-field>
        <button mat-flat-button color="primary" type="submit">Sign in</button>
      </form>

      @if (externalAuth.configLoaded && externalAuth.anyProviderConfigured) {
        <div class="auth-divider"><span>or continue with</span></div>
        <div class="external-auth">
          @if (externalAuth.googleConfigured) {
            <div #googleButton class="google-button"></div>
          }
          @if (externalAuth.microsoftConfigured) {
            <button mat-stroked-button type="button" (click)="continueWithMicrosoft()">
              <mat-icon>window</mat-icon>
              Continue with Microsoft
            </button>
          }
        </div>
      }
    </mat-card-content>
    <mat-card-actions>
      <span>New here?</span>
      <a mat-button color="primary" routerLink="/register">Create account</a>
      <a mat-button color="primary" routerLink="/forgot-password">Forgot password?</a>
    </mat-card-actions>
  </mat-card>
</section>
