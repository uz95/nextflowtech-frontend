<section class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Choose new password</mat-card-title>
      <mat-card-subtitle>Use the reset token created for your account.</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Reset token</mat-label>
          <input matInput formControlName="token" autocomplete="one-time-code">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>New password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="newPassword" autocomplete="new-password">
          <button mat-icon-button matSuffix type="button" aria-label="Toggle password" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Confirm password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="confirmPassword" autocomplete="new-password">
        </mat-form-field>
        <button mat-flat-button color="primary" type="submit">
          <mat-icon>lock_reset</mat-icon>
          Update password
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <a mat-button color="primary" routerLink="/login">
        <mat-icon>arrow_back</mat-icon>
        Back to sign in
      </a>
    </mat-card-actions>
  </mat-card>
</section>
