<section class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Reset password</mat-card-title>
      <mat-card-subtitle>Enter your account email and we will send a password reset link.</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email">
        </mat-form-field>
        <button mat-flat-button color="primary" type="submit">
          <mat-icon>mail</mat-icon>
          Email reset link
        </button>
      </form>

      @if (resetToken) {
        <div class="demo-token">
          <span>Email is not configured for this environment</span>
          <code>{{ resetToken }}</code>
          <button mat-stroked-button color="primary" type="button" (click)="continueToReset()">Use token</button>
        </div>
      }
    </mat-card-content>
    <mat-card-actions>
      <a mat-button color="primary" routerLink="/login">
        <mat-icon>arrow_back</mat-icon>
        Back to sign in
      </a>
    </mat-card-actions>
  </mat-card>
</section>
